name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - run: pip install -r requirements_test.txt
      - run: pytest tests -q

  card:
    name: card (vitest + Playwright)
    runs-on: ubuntu-latest
    # Si attiva quando i test della card sono presenti (package.json).
    steps:
      - uses: actions/checkout@v4
      - name: Controlla presenza test card
        id: has
        run: echo "found=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.found == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.has.outputs.found == 'true'
        run: npm ci
      - if: steps.has.outputs.found == 'true'
        run: npm test
      - if: steps.has.outputs.found == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.has.outputs.found == 'true'
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure() && steps.has.outputs.found == 'true'
        with:
          name: playwright-results
          path: tests/card/e2e/test-results
          if-no-files-found: ignore

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
